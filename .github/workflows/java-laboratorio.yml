name: Java laboratory
on:
  push:
    branches: [feat/laboratorio-java-visual, main]
    paths: ['laboratorio-java/**', '.github/workflows/java-laboratorio.yml']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify originals
        run: tr -d '\r' < laboratorio-java/docs/originales-sha256.txt | sha256sum -c -
      - name: Compile and test
        working-directory: laboratorio-java
        run: |
          mkdir -p build/evidence
          java -Dfile.encoding=UTF-8 Build.java test | tee build/evidence/core.txt
      - name: Install virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
      - name: Test real windows and interactions
        if: runner.os == 'Linux'
        working-directory: laboratorio-java
        run: |
          xvfb-run -a java -Dfile.encoding=UTF-8 -Dawt.useSystemAAFontSettings=on -Dswing.aatext=true -Xmx768m -cp build/classes lab.GuiSmoke | tee build/evidence/windows.txt
          xvfb-run -a java -Dfile.encoding=UTF-8 -Dawt.useSystemAAFontSettings=on -Dswing.aatext=true -Xmx768m -cp build/classes lab.UiTests | tee build/evidence/interactions.txt
      - name: Package runnable JAR
        working-directory: laboratorio-java
        run: java -Dfile.encoding=UTF-8 Build.java package
      - name: Preserve exact source snapshot
        if: runner.os == 'Linux'
        run: |
          python3 - <<'PY'
          import subprocess, zipfile, pathlib
          files = subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          with zipfile.ZipFile('laboratorio-java/build/source-snapshot.zip','w',zipfile.ZIP_DEFLATED) as archive:
              for name in files:
                  if name: archive.write(name,name)
          PY
      - name: Preserve build and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: laboratorio-java-${{ matrix.os }}
          path: |
            laboratorio-java/dist/
            laboratorio-java/build/evidence/
            laboratorio-java/build/screenshots/
            laboratorio-java/build/source-snapshot.zip
          retention-days: 30
